name: Publish NuGet

# Packs AustralianHolidays and pushes it to nuget.org using Trusted Publishing
# (OIDC) — no long-lived API key is stored. GitHub mints a short-lived OIDC
# token; the NuGet/login action exchanges it for a temporary nuget.org API key,
# issued only because a matching trusted-publishing policy is registered for
# this repo + workflow.
#
# Trigger: pushing a tag (same trigger as milestone-release.yml), or manually
# from the Actions tab.
#
# One-time setup (required before the first tag, or the publish step fails):
#   1. nuget.org -> Account -> Trusted Publishing: add a policy for owner
#      `pmcau`, repository `AustralianHolidays`, workflow file `publish-nuget.yml`,
#      scoped to the AustralianHolidays package.
#   2. Repo -> Settings -> Secrets and variables -> Actions -> Variables: set
#      NUGET_USER to your nuget.org username (a username isn't sensitive, so it
#      lives in a variable rather than a secret).

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  id-token: write   # required: lets the job request a GitHub OIDC token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet OIDC login
        # Exchanges the workflow's GitHub OIDC token for a short-lived nuget.org
        # API key (exposed to later steps as steps.login.outputs.NUGET_API_KEY).
        # Requires the trusted-publishing policy described above.
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Build & pack
        # ProjectDefaults sets GeneratePackageOnBuild=true, so a plain Release
        # build packs AustralianHolidays into ./nugets as the final build step —
        # the same path the Test workflow relies on, so it's known-good.
        run: dotnet build src --configuration Release

      - name: Push to nuget.org
        # --skip-duplicate makes re-runs idempotent: re-pushing an already
        # published version is a no-op instead of a hard failure.
        run: >
          dotnet nuget push "nugets/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

# ---------------------------------------------------------------------------
# Fallback: static API-key publishing (no Trusted Publishing). To switch back,
# remove `id-token: write` above, delete the "NuGet OIDC login" step, add a
# NUGET_API_KEY repo secret, and use it in the push step instead:
#
#   - name: Push to nuget.org
#     run: >
#       dotnet nuget push "nugets/*.nupkg"
#       --api-key "${{ secrets.NUGET_API_KEY }}"
#       --source https://api.nuget.org/v3/index.json
#       --skip-duplicate
# ---------------------------------------------------------------------------
